swagger: "2.0"

info:
  title: "Mechanic Shop API"
  description: "API for managing customers, mechanics, service tickets, and inventory for a mechanic shop."
  version: "1.0.0"

host: "mechanic-shop-api-6bmx.onrender.com"

schemes:
  - "https"

consumes:
  - "application/json"

produces:
  - "application/json"

securityDefinitions:
  bearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: "Enter the JWT token using the format: Bearer <token>"

paths:
  /customers:
    post:
      tags:
        - Customers
      summary: "Create a customer"
      description: "Creates a new customer account."
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/CustomerCreate"
      responses:
        201:
          description: "Customer created successfully"
          schema:
            $ref: "#/definitions/Customer"

    get:
      tags:
        - Customers
      summary: "Get all customers"
      description: "Returns customers with pagination support."
      parameters:
        - in: query
          name: limit
          type: integer
          default: 10
          description: "Maximum number of customers to return."
        - in: query
          name: offset
          type: integer
          default: 0
          description: "Number of customers to skip."
      responses:
        200:
          description: "Customers retrieved successfully"
          schema:
            type: array
            items:
              $ref: "#/definitions/Customer"

  /customers/login:
    post:
      tags:
        - Customers
      summary: "Customer login"
      description: "Authenticates a customer and returns a JWT token."
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/LoginCredentials"
      responses:
        200:
          description: "Login successful"
          schema:
            $ref: "#/definitions/LoginResponse"
        401:
          description: "Invalid email or password"

  /customers/{id}:
    get:
      tags:
        - Customers
      summary: "Get customer by ID"
      parameters:
        - in: path
          name: id
          required: true
          type: integer
      responses:
        200:
          description: "Customer retrieved successfully"
          schema:
            $ref: "#/definitions/Customer"
        404:
          description: "Customer not found"

    put:
      tags:
        - Customers
      summary: "Update a customer"
      parameters:
        - in: path
          name: id
          required: true
          type: integer
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/CustomerUpdate"
      responses:
        200:
          description: "Customer updated successfully"
          schema:
            $ref: "#/definitions/Customer"
        404:
          description: "Customer not found"

    delete:
      tags:
        - Customers
      summary: "Delete a customer"
      parameters:
        - in: path
          name: id
          required: true
          type: integer
      responses:
        200:
          description: "Customer deleted successfully"
          schema:
            $ref: "#/definitions/MessageResponse"
        404:
          description: "Customer not found"

  /mechanics/:
    post:
      tags:
        - Mechanics
      summary: "Create a mechanic"
      description: "Creates a new mechanic."
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/MechanicCreate"
      responses:
        201:
          description: "Mechanic created successfully"
          schema:
            $ref: "#/definitions/Mechanic"

    get:
      tags:
        - Mechanics
      summary: "Get all mechanics"
      description: "Returns all mechanics."
      responses:
        200:
          description: "Mechanics retrieved successfully"
          schema:
            type: array
            items:
              $ref: "#/definitions/Mechanic"

  /mechanics/{id}:
    put:
      tags:
        - Mechanics
      summary: "Update a mechanic"
      parameters:
        - in: path
          name: id
          required: true
          type: integer
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/MechanicUpdate"
      responses:
        200:
          description: "Mechanic updated successfully"
          schema:
            $ref: "#/definitions/Mechanic"
        404:
          description: "Mechanic not found"

    delete:
      tags:
        - Mechanics
      summary: "Delete a mechanic"
      parameters:
        - in: path
          name: id
          required: true
          type: integer
      responses:
        200:
          description: "Mechanic deleted successfully"
          schema:
            $ref: "#/definitions/MessageResponse"
        404:
          description: "Mechanic not found"

  /mechanics/most-active:
    get:
      tags:
        - Mechanics
      summary: "Get most active mechanics"
      description: "Returns mechanics ordered by the number of service tickets they have worked on."
      responses:
        200:
          description: "Mechanics retrieved successfully"
          schema:
            type: array
            items:
              $ref: "#/definitions/Mechanic"

  /service-tickets/:
    post:
      tags:
        - Service Tickets
      summary: "Create a service ticket"
      description: "Creates a new service ticket."
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/ServiceTicketCreate"
      responses:
        201:
          description: "Service ticket created successfully"
          schema:
            $ref: "#/definitions/ServiceTicket"

    get:
      tags:
        - Service Tickets
      summary: "Get all service tickets"
      description: "Returns all service tickets."
      responses:
        200:
          description: "Service tickets retrieved successfully"
          schema:
            type: array
            items:
              $ref: "#/definitions/ServiceTicket"

  /service-tickets/my-tickets:
    get:
      tags:
        - Service Tickets
      summary: "Get authenticated customer's service tickets"
      description: "Returns service tickets belonging to the authenticated customer."
      security:
        - bearerAuth: []
      responses:
        200:
          description: "Service tickets retrieved successfully"
          schema:
            type: array
            items:
              $ref: "#/definitions/ServiceTicket"
        401:
          description: "Missing, expired, or invalid token"

  /service-tickets/{ticket_id}/assign-mechanic/{mechanic_id}:
    put:
      tags:
        - Service Tickets
      summary: "Assign a mechanic to a service ticket"
      parameters:
        - in: path
          name: ticket_id
          required: true
          type: string
        - in: path
          name: mechanic_id
          required: true
          type: integer
      responses:
        200:
          description: "Mechanic assigned successfully"
          schema:
            $ref: "#/definitions/MessageResponse"
        404:
          description: "Service ticket or mechanic not found"

  /service-tickets/{ticket_id}/remove-mechanic/{mechanic_id}:
    put:
      tags:
        - Service Tickets
      summary: "Remove a mechanic from a service ticket"
      parameters:
        - in: path
          name: ticket_id
          required: true
          type: string
        - in: path
          name: mechanic_id
          required: true
          type: integer
      responses:
        200:
          description: "Mechanic removed successfully"
          schema:
            $ref: "#/definitions/MessageResponse"
        404:
          description: "Service ticket or mechanic not found"

  /service-tickets/{ticket_id}/edit:
    put:
      tags:
        - Service Tickets
      summary: "Edit mechanics assigned to a service ticket"
      description: "Adds or removes multiple mechanics from an existing service ticket."
      parameters:
        - in: path
          name: ticket_id
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/ServiceTicketMechanicEdit"
      responses:
        200:
          description: "Service ticket updated successfully"
          schema:
            $ref: "#/definitions/ServiceTicket"
        404:
          description: "Service ticket not found"

  /service-tickets/{ticket_id}/add-inventory/{inventory_id}:
    put:
      tags:
        - Service Tickets
      summary: "Add inventory to a service ticket"
      description: "Associates an inventory item with an existing service ticket."
      parameters:
        - in: path
          name: ticket_id
          required: true
          type: string
        - in: path
          name: inventory_id
          required: true
          type: integer
      responses:
        200:
          description: "Inventory item added successfully"
          schema:
            $ref: "#/definitions/MessageResponse"
        404:
          description: "Service ticket or inventory item not found"

  /inventory/:
    post:
      tags:
        - Inventory
      summary: "Create an inventory item"
      description: "Creates a new inventory item."
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/InventoryCreate"
      responses:
        201:
          description: "Inventory item created successfully"
          schema:
            $ref: "#/definitions/Inventory"

    get:
      tags:
        - Inventory
      summary: "Get all inventory"
      description: "Returns all inventory items."
      responses:
        200:
          description: "Inventory retrieved successfully"
          schema:
            type: array
            items:
              $ref: "#/definitions/Inventory"

  /inventory/{id}:
    get:
      tags:
        - Inventory
      summary: "Get inventory item by ID"
      parameters:
        - in: path
          name: id
          required: true
          type: integer
      responses:
        200:
          description: "Inventory item retrieved successfully"
          schema:
            $ref: "#/definitions/Inventory"
        404:
          description: "Inventory item not found"

    put:
      tags:
        - Inventory
      summary: "Update an inventory item"
      parameters:
        - in: path
          name: id
          required: true
          type: integer
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/InventoryUpdate"
      responses:
        200:
          description: "Inventory item updated successfully"
          schema:
            $ref: "#/definitions/Inventory"
        404:
          description: "Inventory item not found"

    delete:
      tags:
        - Inventory
      summary: "Delete an inventory item"
      parameters:
        - in: path
          name: id
          required: true
          type: integer
      responses:
        200:
          description: "Inventory item deleted successfully"
          schema:
            $ref: "#/definitions/MessageResponse"
        404:
          description: "Inventory item not found"

definitions:
  Customer:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      email:
        type: string
      phone:
        type: string

  CustomerCreate:
    type: object
    required:
      - name
      - email
      - phone
      - password
    properties:
      name:
        type: string
      email:
        type: string
      phone:
        type: string
      password:
        type: string

  CustomerUpdate:
    type: object
    properties:
      name:
        type: string
      email:
        type: string
      phone:
        type: string

  LoginCredentials:
    type: object
    required:
      - email
      - password
    properties:
      email:
        type: string
      password:
        type: string

  LoginResponse:
    type: object
    properties:
      status:
        type: string
      message:
        type: string
      auth_token:
        type: string

  MessageResponse:
    type: object
    properties:
      message:
        type: string

  Mechanic:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      email:
        type: string
      phone:
        type: string
      salary:
        type: number
        format: float

  MechanicCreate:
    type: object
    required:
      - name
      - email
      - phone
      - salary
    properties:
      name:
        type: string
      email:
        type: string
      phone:
        type: string
      salary:
        type: number
        format: float

  MechanicUpdate:
    type: object
    properties:
      name:
        type: string
      email:
        type: string
      phone:
        type: string
      salary:
        type: number
        format: float

  ServiceTicket:
    type: object
    properties:
      VIN:
        type: string
      service_date:
        type: string
        format: date
      service_desc:
        type: string
      customer_id:
        type: integer

  ServiceTicketCreate:
    type: object
    required:
      - VIN
      - service_date
      - service_desc
      - customer_id
    properties:
      VIN:
        type: string
      service_date:
        type: string
        format: date
      service_desc:
        type: string
      customer_id:
        type: integer

  ServiceTicketMechanicEdit:
    type: object
    properties:
      add_ids:
        type: array
        items:
          type: integer
      remove_ids:
        type: array
        items:
          type: integer

  Inventory:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string
      price:
        type: number
        format: float

  InventoryCreate:
    type: object
    required:
      - name
      - price
    properties:
      name:
        type: string
      price:
        type: number
        format: float

  InventoryUpdate:
    type: object
    properties:
      name:
        type: string
      price:
        type: number
        format: float
